<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Ristiseiska{% endblock %}</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
      }
      h1 {
        color: #333;
      }
      nav a {
        margin-right: 10px;
        text-decoration: none;
        color: #007bff;
      }
      nav a:hover {
        text-decoration: underline;
      }
      /* Styles for the overlay and modal */
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      #password-modal {
        background-color: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        text-align: center;
        display: none;
      }
      #password-modal input {
        padding: 10px;
        margin: 10px;
        width: 200px;
      }
      #password-modal button {
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      #password-modal button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <div id="password-modal">
        <h2>Enter Password</h2>
        <input type="password" id="password-input" placeholder="Password" />
        <p id="error-message" style="color: red"></p>
        <button id="password-submit">Enter</button>
      </div>
    </div>
    <nav>
      <a href="{% url 'game_create' %}">48</a>
      <a href="{% url 'game_list' %}">Games</a>
      <a href="{% url 'player_list' %}">Players</a>
      <a href="{% url 'season_list' %}">Seasons</a>
    </nav>
    {% block content %} {% endblock %}
    <script>
      const overlay = document.getElementById("overlay");
      const passwordModal = document.getElementById("password-modal");
      const passwordInput = document.getElementById("password-input");
      const passwordSubmit = document.getElementById("password-submit");
      const errorMessage = document.getElementById("error-message");
      const localStorageKey = "passwordEntered"; // Key for localStorage

      // Function to show the modal
      function showPasswordModal() {
        overlay.style.display = "flex";
        passwordModal.style.display = "block";
        passwordInput.focus();
      }

      // Function to hide the modal
      function hidePasswordModal() {
        overlay.style.display = "none";
        passwordModal.style.display = "none";
      }

      // Check if the password is correct using an AJAX call
      function checkPassword() {
        const enteredPassword = passwordInput.value;
        fetch("/check_password/", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": getCookie("csrftoken"),
          },
          body: `password=${enteredPassword}`,
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.valid) {
              hidePasswordModal();
              localStorage.setItem(localStorageKey, "true"); // Save to localStorage
            } else {
              errorMessage.textContent =
                "Incorrect password. Please try again.";
              passwordInput.value = "";
              passwordInput.focus();
            }
          })
          .catch((error) => {
            console.error("Error checking password:", error);
            errorMessage.textContent =
              "Error checking password. Please try again later.";
          });
      }

      // Helper function to get the CSRF token from the cookie
      function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== "") {
          const cookies = document.cookie.split(";");
          for (let i = 0; i < cookies.length; i++) {
            let cookie = cookies[i].trim();
            if (cookie.startsWith(name + "=")) {
              cookieValue = cookie.substring(name.length + 1);
              break;
            }
          }
        }
        return cookieValue;
      }

      // Event Listeners
      passwordSubmit.addEventListener("click", checkPassword);
      passwordInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          checkPassword();
        }
      });

      // Check localStorage on page load
      document.addEventListener("DOMContentLoaded", () => {
        if (localStorage.getItem(localStorageKey) !== "true") {
          showPasswordModal();
        }
      });
    </script>
  </body>
</html>
