{% extends 'base.html' %} {% block content %}
<h1>Game Create</h1>
{% if create == 'list' %}
<ul>
  {% for obj in object_list %}
  <li>{{ obj }}</li>
  {% endfor %}
</ul>
{% else %}
<form method="post">
  {% csrf_token %} {{ form.as_p }}
  <button type="submit">Submit</button>
</form>
{% endif %} {% endblock %}
